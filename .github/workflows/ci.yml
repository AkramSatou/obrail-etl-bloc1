name: CI — ETL Bloc 1

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  etl-tests:
    name: Tests ETL (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: obrail
          POSTGRES_PASSWORD: obrail
          POSTGRES_DB: obrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL tests
        env:
          DB_TARGET: postgresql
          TEST_DATABASE_URL: postgresql+psycopg2://obrail:obrail@localhost:5432/obrail
        run: pytest tests/ -v --tb=short

  etl-mysql:
    name: Smoke test ETL (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: obrail_europe_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL against MySQL (smoke test)
        env:
          DB_TARGET: mysql
          DB_HOST: localhost
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: obrail_europe_db
          CSV_DAY: tests/fixtures/eu_trips_sample.csv
          CSV_NIGHT_EU: tests/fixtures/eu_trips_night_sample.csv
          CSV_NIGHT_DE: tests/fixtures/de_night_sample.csv
        run: |
          python etl.py
          echo "Smoke test MySQL : OK"
